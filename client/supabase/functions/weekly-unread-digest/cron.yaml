# Cron schedule for weekly unread messages digest
# Runs every Sunday at 12:00 AM IST (6:30 PM UTC Saturday / 18:30 UTC Saturday)
# To convert to your timezone: https://www.worldtimebuddy.com/

# Format: minute hour day-of-month month day-of-week
# "30 18 * * 6" = Every Saturday at 6:30 PM UTC (Sunday 12:00 AM IST)
# Note: Since IST is UTC+5:30, Sunday 12:00 AM IST = Saturday 6:30 PM UTC

schedule: "30 18 * * 6"
   